name: Build Linux x64

on:
  workflow_dispatch:

env:
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: linux-x64-manual

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build codeg-mcp sidecar
        run: pnpm tauri:prepare-sidecars --target x86_64-unknown-linux-gnu

      - name: Build Codeg desktop binary
        env:
          CODEG_SKIP_SIDECAR: "1"
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --no-bundle

      - name: Package runnable artifact
        run: |
          mkdir -p dist/codeg-linux-x64
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/codeg \
            dist/codeg-linux-x64/codeg
          cp src-tauri/binaries/codeg-mcp-x86_64-unknown-linux-gnu \
            dist/codeg-linux-x64/codeg-mcp
          chmod +x dist/codeg-linux-x64/codeg dist/codeg-linux-x64/codeg-mcp
          tar -C dist -czf dist/codeg-linux-x64.tar.gz codeg-linux-x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeg-linux-x64
          path: dist/codeg-linux-x64.tar.gz
          if-no-files-found: error
